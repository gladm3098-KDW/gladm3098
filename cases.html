<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실적 및 성공사례</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
}

/* 헤더 */
.header {
    text-align: center;
    padding: 20px;
}

/* 필터 */
.filter-btn-group {
    text-align: center;
    margin: 10px 0 20px;
}

.btn {
    padding: 8px 14px;
    border: 1px solid #ccc;
    background: #fff;
    margin: 3px;
    border-radius: 6px;
    cursor: pointer;
}

.btn.active {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
}

/* 🔥 4 + 4 고정 grid */
.cases-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 20px;
}

@media (max-width: 900px) {
    .cases-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {
    .cases-grid {
        grid-template-columns: 1fr;
    }
}

.case-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #ddd;
}

.case-card img {
    width: 100%;
    height: 260px;
    object-fit: cover;
}

.case-info {
    padding: 12px;
    text-align: center;
}

.tag {
    display: inline-block;
    background: #2563eb;
    color: white;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 12px;
}

/* 🔙 중앙 동그라미 뒤로가기 */
.back-circle {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 64px;
    height: 64px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 999;
}

.back-circle:hover {
    transform: translate(-50%, -50%) scale(1.05);
}

/* 🔥 하단 상담 버튼 (곡선 스타일) */
.consult-bar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 54px;
    background: #2563eb;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    font-weight: bold;
    text-decoration: none;
}

.consult-bar:hover {
    background: #1e40af;
}
</style>

</head>

<body>

<div class="header">
    <h2>실적 및 성공사례</h2>
    <p>HACCP 및 식품 인허가 실제 사례</p>

    <div class="filter-btn-group">
        <button class="btn active" data-filter="all">전체</button>
        <button class="btn" data-filter="food">식품제조</button>
        <button class="btn" data-filter="meat">축산물</button>
        <button class="btn" data-filter="haccp">HACCP</button>
    </div>
</div>

<!-- 4 + 4 구조 -->
<div class="cases-grid" id="grid"></div>

<!-- 🔙 중앙 뒤로가기 -->
<div class="back-circle" onclick="history.back()">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</div>

<!-- 💬 하단 상담 -->
<a href="consult.html" class="consult-bar">
    💬 상담 바로가기
</a>

<script>
const data = [
    {img:"images/food-license.png.png", tag:"식품제조", category:"food", title:"육수 제조 등록"},
    {img:"images/dumpling-haccp.png.png", tag:"HACCP", category:"haccp", title:"도시락 HACCP"},
    {img:"images/meat-haccp.png.png", tag:"축산물", category:"meat", title:"포장육 허가"},
    {img:"images/food-registration.png.png", tag:"식품제조", category:"food", title:"제과 등록"},

    {img:"images/snack-haccp.png.png", tag:"HACCP", category:"haccp", title:"베이커리 HACCP"},
    {img:"images/crab-haccp.png.png", tag:"축산물", category:"meat", title:"식육가공 허가"},
    {img:"images/bonebroth-haccp.png.png", tag:"HACCP", category:"haccp", title:"사골 HACCP"},
    {img:"images/food-haccp.png.png", tag:"HACCP", category:"haccp", title:"식품 HACCP"}
];

const grid = document.getElementById("grid");
const buttons = document.querySelectorAll(".btn");

function render(filter="all") {
    grid.innerHTML = "";

    const filtered = data.filter(d => filter === "all" || d.category === filter);

    filtered.slice(0, 8).forEach(d => {
        grid.innerHTML += `
        <div class="case-card">
            <img src="${d.img}">
            <div class="case-info">
                <span class="tag">${d.tag}</span>
                <p>${d.title}</p>
            </div>
        </div>`;
    });
}

buttons.forEach(b => {
    b.addEventListener("click", () => {
        buttons.forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        render(b.dataset.filter);
    });
});

render();
</script>

</body>
</html>
