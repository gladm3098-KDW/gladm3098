<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실적 및 성공사례 | HACCP & 식품 인허가</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f8f9fb;
}

/* 상단 영역 */
.header {
    padding: 20px;
    text-align: center;
    background: white;
    border-bottom: 1px solid #ddd;
}

/* 버튼 */
.btn {
    padding: 8px 14px;
    margin: 4px;
    border: 1px solid #ccc;
    background: #fff;
    cursor: pointer;
    border-radius: 6px;
}

.btn.active {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
}

/* 필터 */
.filter-btn-group {
    margin: 15px 0;
    text-align: center;
}

/* 그리드 */
.cases-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    padding: 20px;
}

/* 카드 */
.case-card {
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
    background: white;
    transition: 0.3s;
}

.case-card img {
    width: 100%;
    height: 260px;
    object-fit: cover;
}

.case-info {
    padding: 12px;
    text-align: center;
}

.tag {
    font-size: 12px;
    background: #2563eb;
    color: white;
    padding: 4px 8px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 6px;
}

/* 🔥 하단 플로팅 버튼 */
.floating-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    display: flex;
    background: white;
    border-top: 1px solid #ddd;
    z-index: 999;
}

.floating-bar a {
    flex: 1;
    text-align: center;
    padding: 14px;
    text-decoration: none;
    font-weight: bold;
}

.back-btn {
    background: #f1f5f9;
    color: #333;
}

.consult-btn {
    background: #2563eb;
    color: white;
}
</style>

</head>

<body>

<div class="header">
    <h2>실적 및 성공사례</h2>
    <p>HACCP 및 식품 인허가 실제 사례</p>

    <div class="filter-btn-group">
        <button class="btn active" data-filter="all">전체보기</button>
        <button class="btn" data-filter="food">식품제조가공업</button>
        <button class="btn" data-filter="meat">축산물가공업</button>
        <button class="btn" data-filter="haccp">HACCP 인증</button>
    </div>
</div>

<div class="cases-grid" id="casesGrid"></div>

<!-- 🔥 하단 고정 버튼 -->
<div class="floating-bar">
    <a href="javascript:history.back()" class="back-btn">← 뒤로가기</a>
    <a href="consult.html" class="consult-btn">💬 상담 바로가기</a>
</div>

<script>
const casesData = [
    {img:"images/food-license.png.png", tag:"식품제조가공업", category:"food", title:"육수 제조 공장 등록"},
    {img:"images/dumpling-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"도시락 HACCP 인증"},
    {img:"images/meat-haccp.png.png", tag:"축산물가공업", category:"meat", title:"포장육 허가 완료"},
    {img:"images/food-registration.png.png", tag:"식품제조가공업", category:"food", title:"제과 제조업 등록"},
    {img:"images/snack-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"베이커리 HACCP"},
    {img:"images/crab-haccp.png.png", tag:"축산물가공업", category:"meat", title:"식육가공업 허가"},
    {img:"images/bonebroth-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"사골육수 HACCP"},
    {img:"images/food-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"식품 HACCP 인증"},
    {img:"images/Food-Registration.png.png", tag:"식품제조가공업", category:"food", title:"식품 제조업 등록"}
];

const grid = document.getElementById("casesGrid");
const buttons = document.querySelectorAll(".btn");

let showLimit = 8;

function render(filter="all") {

    grid.innerHTML = "";

    let filtered = casesData.filter(item => {
        return filter === "all" || item.category === filter;
    });

    filtered.slice(0, showLimit).forEach(item => {

        grid.innerHTML += `
        <div class="case-card">
            <img src="${item.img}" alt="${item.title}">
            <div class="case-info">
                <span class="tag">${item.tag}</span>
                <p>${item.title}</p>
            </div>
        </div>`;
    });
}

buttons.forEach(btn => {
    btn.addEventListener("click", () => {

        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        render(btn.dataset.filter);
    });
});

render();
</script>

</body>
</html>
