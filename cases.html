<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성공사례 | HACCP & 식품 인허가</title>

<!-- 구글 프리미엄 폰트 (Noto Sans KR) 적용 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Noto Sans KR', Arial, sans-serif;
    background-color: #f9f9f9; 
    margin: 0;
    padding: 0;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 60px 20px;
    text-align: center;
}

/* 제목 섹션 */
h1 {
    font-size: 32px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
}

.container > p {
    font-size: 15px;
    color: #64748b;
    margin-bottom: 40px;
}

/* 필터 버튼 그룹 */
.filter-btn-group {
    margin: 30px 0 40px 0;
}

.btn {
    padding: 10px 22px;
    margin: 0 4px;
    border: 1px solid #1e293b; 
    background: #fff;
    color: #1e293b;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 4px; 
    transition: all 0.2s ease;
}

.btn.active {
    background: #111e38; 
    color: white;
    border-color: #111e38;
}

/* 그리드 레이아웃 */
.cases-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
    margin-top: 20px;
}

/* 카드 스타일 */
.case-card {
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: flex;
    flex-direction: column;
    height: 100%;
}

.case-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
}

/* [핵심 수정 1] 이미지 세로 비율을 대폭 늘려 위아래 잘림을 원천 차단 */
.case-card img {
    width: 100%;
    aspect-ratio: 4 / 5.8; /* 비율을 5.8로 늘려 하단 인증서 끝자락까지 완벽하게 노출시킵니다 */
    object-fit: cover; 
    display: block;
    flex-shrink: 0;
}

/* [핵심 수정 2] 하단 텍스트 영역의 숨은 여백 및 높이를 최저 한계치까지 압축 */
.case-info {
    padding: 6px 8px 8px 8px; /* 패딩을 한 자릿수(6px~8px)로 줄여 칼같이 밀착 */
    text-align: center;
    border-top: 1px solid #f1f5f9;
    background: #fff;
    flex-grow: 0; 
    flex-shrink: 0;
    height: auto; /* 고정 높이를 해제하고 텍스트 부피만큼만 최소화 */
}

/* 태그 여백 및 행간 최소화 */
.tag {
    font-size: 11px;
    font-weight: 500;
    background: #22447a; 
    color: white;
    padding: 2px 6px;
    border-radius: 3px;
    display: inline-block;
    margin-bottom: 2px; /* 글씨와 바짝 붙도록 간격 최소화 */
    line-height: 1.1;
}

/* 제목 텍스트 행간 압축 */
.case-info p {
    font-size: 13.5px;
    font-weight: 500;
    color: #1e293b;
    margin: 0;
    padding: 0;
    line-height: 1.2; /* 글자 위아래 숨은 행간 공간을 축소해 영역 높이를 더 낮춤 */
    word-break: keep-all; 
}
</style>

</head>

<body>

<div class="container">

<h1>실적 및 성공사례</h1>
<p>결과가 증명합니다. 개인정보 보호를 위해 마스킹 처리된 실제 인허가증 및 인증서입니다.</p>

<div class="filter-btn-group">
    <button class="btn active" data-filter="all">전체보기</button>
    <button class="btn" data-filter="food">식품제조가공업</button>
    <button class="btn" data-filter="meat">축산물가공업</button>
    <button class="btn" data-filter="haccp">HACCP 인증</button>
</div>

<div class="cases-grid" id="casesGrid"></div>

</div>

<script>
const casesData = [
    {img:"images/food-license.png.png", tag:"식품제조가공업", category:"food", title:"수도권 육수 제조 공장 등록 완료"},
    {img:"images/dumpling-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"도시락류 스마트 HACCP 인증"},
    {img:"images/meat-haccp.png.png", tag:"축산물가공업", category:"meat", title:"포장육 (식육포장처리업) 허가 완료"},
    {img:"images/food-registration.png.png", tag:"식품제조가공업", category:"food", title:"디저트 제과류 제조업소 등록 완료"},
    {img:"images/snack-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"베이커리 소규모 HACCP 인증 완료"},
    {img:"images/crab-haccp.png.png", tag:"축산물가공업", category:"meat", title:"식육가공업(소시지 등) 허가 완료"},
    {img:"images/bonebroth-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"사골육수 HACCP 완료"},
    {img:"images/food-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"식품 HACCP 인증 완료"}
];

const grid = document.getElementById("casesGrid");
const buttons = document.querySelectorAll(".btn");

let showLimit = 8;

function render(filter="all") {

    grid.innerHTML = "";

    let filtered = casesData.filter(item => {
        return filter === "all" || item.category === filter;
    });

    filtered.slice(0, showLimit).forEach(item => {
        grid.innerHTML += `
        <div class="case-card">
            <img src="${item.img}" alt="${item.title}">
            <div class="case-info">
                <div><span class="tag">${item.tag}</span></div>
                <p>${item.title}</p>
            </div>
        </div>`;
    });
}

// 버튼 클릭 이벤트
buttons.forEach(btn => {
    btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render(btn.dataset.filter);
    });
});

// 초기 로딩
render();
</script>

</body>
</html>
