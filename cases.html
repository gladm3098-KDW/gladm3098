<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성공사례 | HACCP & 식품 인허가</title>

<!-- 구글 프리미엄 폰트 (Noto Sans KR) 적용 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Noto Sans KR', Arial, sans-serif;
    background-color: #f9f9f9; 
    margin: 0;
    padding: 0;
    color: #333;
}

/* ==========================================
   상단 헤더 내비게이션 디자인
============================================*/
.main-header {
    width: 100%;
    background-color: #fff;
    border-bottom: 1px solid #e2e8f0;
    position: sticky;
    top: 0;
    z-index: 10000;
}

.header-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    height: 70px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
}

/* 로고 스타일 */
.logo {
    font-size: 20px;
    font-weight: 700;
    color: #111e38;
    text-decoration: none;
    display: flex;
    align-items: center;
    letter-spacing: -0.5px;
}

.logo span {
    color: #bfa17a; 
    margin-right: 4px;
}

/* 네비게이션 메뉴 */
.nav-menu {
    display: flex;
    gap: 24px;
    list-style: none;
    margin: 0;
    padding: 0;
}

.nav-item a {
    font-size: 14px;
    font-weight: 500;
    color: #475569;
    text-decoration: none;
    transition: color 0.2s ease;
}

.nav-item a:hover {
    color: #111e38;
    font-weight: 700;
}

/* ==========================================
   기본 콘텐츠 레이아웃
============================================*/
.container {
    max-width: 1200px;
    margin: auto;
    padding: 60px 20px 140px 20px; 
    text-align: center;
}

/* 제목 섹션 */
h1 {
    font-size: 32px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
}

.container > p {
    font-size: 15px;
    color: #64748b;
    margin-bottom: 40px;
}

/* 필터 버튼 그룹 */
.filter-btn-group {
    margin: 30px 0 40px 0;
}

.btn {
    padding: 10px 22px;
    margin: 0 4px;
    border: 1px solid #1e293b; 
    background: #fff;
    color: #1e293b;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 4px; 
    transition: all 0.2s ease;
}

.btn.active {
    background: #111e38; 
    color: white;
    border-color: #111e38;
}

/* 그리드 레이아웃 */
.cases-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
    margin-top: 20px;
}

/* 카드 디자인 */
.case-card {
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: flex;
    flex-direction: column;
    height: 100%;
}

.case-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
}

/* 이미지 잘림 차단 비율 유지 */
.case-card img {
    width: 100%;
    aspect-ratio: 4 / 5.8; 
    object-fit: cover; 
    display: block;
    flex-shrink: 0;
}

/* 하단 글씨 영역 높이 최저 압축 */
.case-info {
    padding: 6px 8px 8px 8px; 
    text-align: center;
    border-top: 1px solid #f1f5f9;
    background: #fff;
    flex-grow: 0; 
    flex-shrink: 0;
    height: auto; 
}

.tag {
    font-size: 11px;
    font-weight: 500;
    background: #22447a; 
    color: white;
    padding: 2px 6px;
    border-radius: 3px;
    display: inline-block;
    margin-bottom: 2px; 
    line-height: 1.1;
}

.case-info p {
    font-size: 13.5px;
    font-weight: 500;
    color: #1e293b;
    margin: 0;
    padding: 0;
    line-height: 1.2; 
    word-break: keep-all; 
}

/* ==========================================
   하단 고정 안내 및 실시간 상담 버튼 영역
============================================*/
.sticky-action-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: rgba(255, 255, 255, 0.95);
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
    padding: 14px 20px;
    box-sizing: border-box;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(8px);
}

.action-container {
    width: 100%;
    max-width: 800px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.action-text {
    font-size: 15px;
    font-weight: 500;
    color: #334155;
    text-align: left;
    white-space: nowrap;
}

.action-btn-group {
    display: flex;
    gap: 10px;
    flex-grow: 1;
    max-width: 500px;
}

/* 버튼 공통 디자인 */
.action-btn {
    flex: 1;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    white-space: nowrap;
}

/* 뒤로가기 버튼 */
.btn-back {
    background-color: #f1f5f9;
    color: #475569;
    border: 1px solid #cbd5e1;
}
.btn-back:hover {
    background-color: #e2e8f0;
}

/* 전화 연결 버튼 */
.btn-phone {
    background-color: #111e38;
    color: #ffffff;
    border: 1px solid #111e38;
}
.btn-phone:hover {
    background-color: #1e293b;
}

/* 카카오톡 문의 버튼 */
.btn-kakao {
    background-color: #fee500;
    color: #181600;
    border: 1px solid #fee500;
}
.btn-kakao:hover {
    background-color: #fdd835;
}

/* 반응형 모바일 헤더 및 하단 바 조절 */
@media (max-width: 768px) {
    .header-container {
        height: 60px;
    }
    .logo {
        font-size: 17px;
    }
    .nav-menu {
        gap: 12px;
    }
    .nav-item a {
        font-size: 12px;
    }
    .action-container {
        flex-direction: column;
        gap: 10px;
    }
    .action-text {
        display: none; 
    }
    .action-btn-group {
        width: 100%;
        max-width: 100%;
    }
    .action-btn {
        padding: 14px 10px;
        font-size: 13.5px;
    }
}
</style>

</head>

<body>

<!-- [상단 헤더] 우측 상담문의 주소를 consult.html로 다이렉트 이동 보완 완료 -->
<header class="main-header">
    <div class="header-container">
        <a href="index.html" class="logo"><span>GL</span> 지엘행정사 사무소</a>
        
        <ul class="nav-menu">
            <li class="nav-item"><a href="index.html#gl-business">업무분야</a></li>
            <li class="nav-item"><a href="index.html#gl-cases">성공사례</a></li>
            <li class="nav-item"><a href="https://blog.naver.com/PostList.naver?blogId=goodlock7ad&from=postList&categoryNo=1" target="_blank">📝 블로그</a></li>
            <!-- [핵심 수정 부분] 내부 스크롤 대신 상담 신청 페이지 파일로 즉시 넘어가도록 조치 -->
            <li class="nav-item"><a href="consult.html">상담문의</a></li>
        </ul>
    </div>
</header>

<div class="container">

<h1>실적 및 성공사례</h1>
<p>결과가 증명합니다. 개인정보 보호를 위해 마스킹 처리된 실제 인허가증 및 인증서입니다.</p>

<div class="filter-btn-group">
    <button class="btn active" data-filter="all">전체보기</button>
    <button class="btn" data-filter="food">식품제조가공업</button>
    <button class="btn" data-filter="meat">축산물가공업</button>
    <button class="btn" data-filter="haccp">HACCP 인증</button>
</div>

<!-- 실적 카드 그리드 -->
<div class="cases-grid" id="casesGrid"></div>

</div>

<!-- 하단 스마트 고정 바 -->
<div class="sticky-action-bar">
    <div class="action-container">
        <div class="action-text">🎯 HACCP·인허가 빠른 상담</div>
        <div class="action-btn-group">
            <button class="action-btn btn-back" onclick="history.back();">이전으로</button>
            <a href="tel:010-3538-3098" class="action-btn btn-phone">📞 전화연결</a>
            <a href="https://open.kakao.com/o/sbwdQcwi" target="_blank" class="action-btn btn-kakao">💬 카카오톡 문의</a>
        </div>
    </div>
</div>

<script>
const casesData = [
    {img:"images/food-license.png.png", tag:"식품제조가공업", category:"food", title:"수도권 육수 제조 공장 등록 완료"},
    {img:"images/dumpling-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"도시락류 스마트 HACCP 인증"},
    {img:"images/meat-haccp.png.png", tag:"축산물가공업", category:"meat", title:"포장육 (식육포장처리업) 허가 완료"},
    {img:"images/food-registration.png.png", tag:"식품제조가공업", category:"food", title:"디저트 제과류 제조업소 등록 완료"},
    {img:"images/snack-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"베이커리 소규모 HACCP 인증 완료"},
    {img:"images/crab-haccp.png.png", tag:"축산물가공업", category:"meat", title:"식육가공업(소시지 등) 허가 완료"},
    {img:"images/bonebroth-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"사골육수 HACCP 완료"},
    {img:"images/food-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"식품 HACCP 인증 완료"}
];

const grid = document.getElementById("casesGrid");
const buttons = document.querySelectorAll(".btn");

let showLimit = 8;

function render(filter="all") {

    grid.innerHTML = "";

    let filtered = casesData.filter(item => {
        return filter === "all" || item.category === filter;
    });

    filtered.slice(0, showLimit).forEach(item => {
        grid.innerHTML += `
        <div class="case-card">
            <img src="${item.img}" alt="${item.title}">
            <div class="case-info">
                <div><span class="tag">${item.tag}</span></div>
                <p>${item.title}</p>
            </div>
        </div>`;
    });
}

buttons.forEach(btn => {
    btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render(btn.dataset.filter);
    });
});

render();
</script>

</body>
</html>
