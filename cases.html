<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성공사례 | HACCP & 식품 인허가</title>

<style>
body {
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
    text-align: center;
}

.filter-btn-group {
    margin: 20px 0;
}

.btn {
    padding: 8px 14px;
    margin: 4px;
    border: 1px solid #ccc;
    background: #fff;
    cursor: pointer;
    border-radius: 6px;
}

.btn.active {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
}

.cases-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    margin-top: 20px;
}

.case-card {
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    transition: 0.3s;
}

.case-card img {
    width: 100%;
    height: 280px;
    object-fit: cover;
}

.case-info {
    padding: 12px;
}

.tag {
    font-size: 12px;
    background: #2563eb;
    color: white;
    padding: 4px 8px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 6px;
}
</style>

</head>

<body>

<div class="container">

<h1>실적 및 성공사례</h1>
<p>HACCP 및 식품 인허가 실제 성공사례</p>

<div class="filter-btn-group">
    <button class="btn active" data-filter="all">전체보기</button>
    <button class="btn" data-filter="food">식품제조가공업</button>
    <button class="btn" data-filter="meat">축산물가공업</button>
    <button class="btn" data-filter="haccp">HACCP 인증</button>
</div>

<div class="cases-grid" id="casesGrid"></div>

</div>

<script>
const casesData = [
    {img:"images/food-license.png.png", tag:"식품제조가공업", category:"food", title:"육수 제조 공장 등록"},
    {img:"images/dumpling-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"도시락 HACCP 인증"},
    {img:"images/meat-haccp.png.png", tag:"축산물가공업", category:"meat", title:"포장육 허가 완료"},
    {img:"images/food-registration.png.png", tag:"식품제조가공업", category:"food", title:"제과 제조업 등록"},
    {img:"images/snack-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"베이커리 HACCP"},
    {img:"images/crab-haccp.png.png", tag:"축산물가공업", category:"meat", title:"식육가공업 허가"},
    {img:"images/bonebroth-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"사골육수 HACCP"},
    {img:"images/food-haccp.png.png", tag:"HACCP 인증", category:"haccp", title:"식품 HACCP 인증"},
    {img:"images/Food-Registration.png.png", tag:"식품제조가공업", category:"food", title:"식품 제조업 등록"}
];

const grid = document.getElementById("casesGrid");
const buttons = document.querySelectorAll(".btn");

// 초기 8개만 표시
let showLimit = 8;

function render(filter="all") {

    grid.innerHTML = "";

    let filtered = casesData.filter(item => {
        return filter === "all" || item.category === filter;
    });

    filtered.slice(0, showLimit).forEach(item => {

        grid.innerHTML += `
        <div class="case-card">
            <img src="${item.img}" alt="${item.title}">
            <div class="case-info">
                <span class="tag">${item.tag}</span>
                <p>${item.title}</p>
            </div>
        </div>`;
    });
}

// 버튼 이벤트
buttons.forEach(btn => {
    btn.addEventListener("click", () => {

        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        render(btn.dataset.filter);
    });
});

// 초기 로딩 (8개만)
render();
</script>

</body>
</html>
